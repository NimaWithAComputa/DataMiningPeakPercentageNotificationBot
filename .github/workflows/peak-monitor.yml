
name: Peak Monitor
 
on:
  schedule:
    # Runs every 30 minutes — bot skips automatically if outside monitoring window
    - cron: '*/15 * * * *'
  workflow_dispatch:
 
jobs:
  check-peak:
    runs-on: ubuntu-latest
 
    permissions:
      contents: write
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Run peak bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYPOWER_USERNAME: ${{ secrets.MYPOWER_USERNAME }}
          MYPOWER_PASSWORD: ${{ secrets.MYPOWER_PASSWORD }}
        run: python peak_bot.py
 
      - name: Save state
        run: |
          git config user.name  "Peak Bot"
          git config user.email "peak-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update peak state [skip ci]"
          git push
 
